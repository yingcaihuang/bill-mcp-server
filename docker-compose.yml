version: '3.8'

services:
  bill-mcp:
    image: ghcr.io/yingcaihuang/bill-mcp-server:latest
    expose:
      - "3000"              # 仅内部网络暴露，不映射到宿主机
    restart: unless-stopped
    networks:
      - internal
      - shared-mcp          # 关键：加入共享网络，nginx 才能反代过来

networks:
  internal:
  shared-mcp:
    external: true          # 引用同一个外部网络，需先 docker network create shared-mcp